<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C 실습 랜덤 문제 생성기</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #1d2430;
      --muted: #637083;
      --line: #d8dee8;
      --blue: #2457a6;
      --blue-weak: #e8f0ff;
      --green: #23745b;
      --green-weak: #e5f5ef;
      --amber: #94620d;
      --amber-weak: #fff2d5;
      --red: #a43d3d;
      --code: #101828;
      --shadow: 0 14px 38px rgba(30, 41, 59, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", "Malgun Gothic", Arial, sans-serif;
      line-height: 1.55;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid var(--line);
    }

    .wrap {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 78px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .subhead {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    main {
      padding: 22px 0 44px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: repeat(5, minmax(120px, 1fr)) auto;
      gap: 12px;
      align-items: end;
      padding: 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      border-radius: 8px;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    select,
    input {
      width: 100%;
      height: 40px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      color: var(--ink);
      font: inherit;
    }

    button {
      height: 40px;
      border: 0;
      border-radius: 6px;
      padding: 0 14px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .primary {
      color: #ffffff;
      background: var(--blue);
    }

    .secondary {
      color: var(--blue);
      background: var(--blue-weak);
      border: 1px solid #c8d8f5;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin: 18px 0 14px;
      border-bottom: 1px solid var(--line);
    }

    .tab {
      height: 42px;
      background: transparent;
      color: var(--muted);
      border-radius: 6px 6px 0 0;
      border: 1px solid transparent;
      border-bottom: 0;
    }

    .tab.active {
      color: var(--blue);
      background: #ffffff;
      border-color: var(--line);
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .summary {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 14px;
    }

    .set {
      margin-bottom: 20px;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .set-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      background: #f9fbff;
      border-bottom: 1px solid var(--line);
    }

    .set-head h2,
    .concept-card h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--green-weak);
      color: var(--green);
      font-size: 12px;
      font-weight: 800;
    }

    .problem {
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }

    .problem:last-child {
      border-bottom: 0;
    }

    .problem h3 {
      margin: 0 0 8px;
      font-size: 17px;
      letter-spacing: 0;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0 12px;
    }

    .pill {
      min-height: 26px;
      padding: 3px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #ffffff;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .columns {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 12px 0;
    }

    .box {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #ffffff;
    }

    .box h4 {
      margin: 0 0 8px;
      color: var(--blue);
      font-size: 14px;
      letter-spacing: 0;
    }

    .overview-lead {
      margin: 0 0 12px;
      color: var(--ink);
      font-size: 15px;
    }

    .overview-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .overview-block {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfe;
    }

    .overview-block strong {
      display: block;
      margin-bottom: 6px;
      color: var(--amber);
      font-size: 13px;
    }

    .overview-block.full {
      grid-column: 1 / -1;
    }

    .answer-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
    }

    .answer-toggle {
      color: var(--green);
      background: var(--green-weak);
      border: 1px solid #bfe3d6;
    }

    .answer-panel {
      margin-top: 12px;
      padding: 14px;
      border: 1px solid #bfe3d6;
      border-radius: 8px;
      background: #fbfffd;
    }

    .answer-panel[hidden] {
      display: none;
    }

    .answer-panel h4 {
      margin: 0 0 8px;
      color: var(--green);
      font-size: 14px;
      letter-spacing: 0;
    }

    .answer-panel .columns {
      margin-bottom: 0;
    }

    ul {
      margin: 0;
      padding-left: 20px;
    }

    pre {
      margin: 0;
      padding: 12px;
      overflow-x: auto;
      border-radius: 8px;
      background: var(--code);
      color: #f8fafc;
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 13px;
      line-height: 1.45;
    }

    .concept-tools {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 12px;
      margin-bottom: 14px;
      align-items: end;
    }

    .concept-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .concept-card {
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }

    .concept-card .source {
      color: var(--muted);
      font-size: 13px;
      margin: 4px 0 12px;
    }

    .detail-block {
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      background: #fbfcfe;
      border: 1px solid var(--line);
    }

    .detail-block strong {
      display: block;
      margin-bottom: 5px;
      color: var(--amber);
    }

    .empty {
      padding: 44px 18px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: #ffffff;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 920px) {
      .toolbar {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .toolbar button {
        width: 100%;
      }

      .concept-grid,
      .columns,
      .overview-grid {
        grid-template-columns: 1fr;
      }

      .concept-tools {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      .wrap {
        width: min(100% - 20px, 1180px);
      }

      .topbar,
      .summary,
      .set-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 21px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap topbar">
      <div>
        <h1>C 실습 랜덤 문제 생성기</h1>
        <p class="subhead">3~13주차 실습문제 개념 DB를 기반으로 변형/확장 문제 세트 3개를 생성합니다.</p>
      </div>
      <button class="secondary" id="downloadMd" type="button">Markdown 저장</button>
    </div>
  </header>

  <main class="wrap">
    <section class="toolbar" aria-label="문제 생성 설정">
      <label>
        시작 주차
        <select id="startWeek"></select>
      </label>
      <label>
        끝 주차
        <select id="endWeek"></select>
      </label>
      <label>
        세트 수
        <input id="setCount" type="number" min="1" max="10" value="3">
      </label>
      <label>
        세트당 문제 수
        <input id="problemCount" type="number" min="1" max="12" value="6">
      </label>
      <label>
        Seed
        <input id="seedInput" type="text" placeholder="비워두면 랜덤">
      </label>
      <button class="primary" id="generateBtn" type="button">랜덤 문제 생성하기</button>
    </section>

    <nav class="tabs" aria-label="페이지 섹션">
      <button class="tab active" data-tab="problems" type="button">랜덤 문제 세트</button>
      <button class="tab" data-tab="concepts" type="button">주차별 개념 DB</button>
    </nav>

    <section class="section active" id="problems">
      <div class="summary">
        <span id="resultInfo">아직 생성된 문제가 없습니다.</span>
        <span>버튼을 누를 때마다 새 세트가 만들어집니다.</span>
      </div>
      <div id="problemSets" class="empty">랜덤 문제 생성하기 버튼을 눌러 문제 세트 3개를 생성하세요.</div>
    </section>

    <section class="section" id="concepts">
      <div class="concept-tools">
        <label>
          주차 필터
          <select id="conceptFilter"></select>
        </label>
        <div class="summary">
          <span id="conceptInfo">3~13주차 개념을 상세 설명 형태로 정리했습니다.</span>
        </div>
      </div>
      <div id="conceptGrid" class="concept-grid"></div>
    </section>
  </main>

  <script>
    const conceptDb = [
      {
        week: 3,
        section: "기본 자료형과 변수",
        source: "3주차 실습문제.pdf",

        forms: ["성별/나이/키를 입력받아 자료형에 맞게 출력", "원화 금액을 USD/EUR/GBP로 정수 환산", "C 정수 자료형의 크기와 범위를 출력"],
        detail: "C 프로그램에서 값을 저장하기 위한 변수 선언과 자료형 선택을 익히는 구간입니다. 문자, 정수, 실수를 각각 다른 서식 지정자로 입력받고 출력하며, 정수형의 표현 범위를 limits.h 매크로로 확인합니다.",

        tips: ["문자는 %c, 정수는 %d, float는 %f를 사용한다.", "환전 문제는 원화 금액 / 환율을 계산한 뒤 int로 저장하면 소수점 아래가 버려진다.", "limits.h의 매크로는 컴파일 환경에 따른 정수 범위를 확인하는 데 사용된다."]

        detail: "기본 입출력 위에 산술 연산, 형변환, 비트 연산을 얹는 구간입니다. 합계와 평균 같은 수치 계산부터 RGB 값을 바이트 단위로 조립하는 문제까지 포함합니다.",
        goals: ["정수와 실수 연산의 결과 차이를 이해한다.", "평균을 출력할 때 소수점 자리수를 제어한다.", "0~255 범위 값을 unsigned char로 다룬다.", "시프트 연산으로 여러 바이트 값을 하나의 정수에 배치한다."],
        tips: ["평균은 정수 나눗셈을 피하려고 float 또는 double로 계산한다.", "printf(\"%.2f\")처럼 정밀도를 지정한다.", "RGB 조립은 red | (green << 8) | (blue << 16) 형태로 생각하면 쉽다."]
      },
      {

        section: "제어문 I",

        tips: ["구구단은 곱해지는 수와 단을 어느 반복문에 둘지 먼저 정한다.", "소수 판별은 2보다 작은 값의 예외를 먼저 처리한다.", "10개마다 줄바꿈처럼 출력 개수를 세는 변수도 반복문 연습에 중요하다."]
      },
      {
        week: 7,
        section: "C 언어 함수",

        concepts: ["함수 정의와 호출", "매개변수와 반환값", "시간 단위 변환", "재귀 함수", "구간 합 재귀 계산"],
        forms: ["시/분/초를 초로 변환", "1부터 N까지 재귀 합", "시작값부터 끝값까지 재귀 합"],
        detail: "계산 단위를 함수로 분리하고, 함수가 값을 받아 결과를 반환하는 흐름을 연습합니다. 재귀 함수에서는 종료 조건과 다음 호출 범위가 가장 중요합니다.",
        goals: ["함수 원형, 정의, 호출의 역할을 구분한다.", "매개변수로 입력을 전달하고 return으로 결과를 돌려받는다.", "재귀 함수의 종료 조건을 설계한다.", "구간 합 문제를 반복문 대신 재귀 호출로 해결한다."],
        tips: ["시간 변환 함수는 hour * 3600 + min * 60 + sec를 반환하면 된다.", "재귀 합은 N이 1이 될 때 멈추거나 start가 end를 넘을 때 멈추게 만든다.", "재귀 호출이 너무 깊어지지 않도록 입력 범위를 확인한다."]
      },
      {
        week: 8,
        section: "기억 클래스",
        source: "8주차 실습문제.pdf",

    function xmur3(str) {
      let h = 1779033703 ^ str.length;
      for (let i = 0; i < str.length; i++) {

        h = h << 13 | h >>> 19;

        h = Math.imul(h ^ h >>> 13, 3266489909);
        return (h ^= h >>> 16) >>> 0;
      };
    }

    function mulberry32(seed) {
      return function() {
        let t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };

      const copy = [...items];
      const result = [];
      while (copy.length && result.length < count) {
        result.push(copy.splice(randInt(rng, 0, copy.length - 1), 1)[0]);
      }
      while (result.length < count) result.push(pick(rng, items));
      return result;
    }

        const candidates = problemTemplates.filter(item => item.week >= spanStart && item.week <= spanEnd);

          });
          lines.push("");
          lines.push("#### 정답 예시 코드", "```c", item.answer.code, "```", "#### 핵심 포인트");
          item.answer.points.forEach(point => lines.push(`- ${point}`));
          lines.push("");
        });
      }
      return lines.join("\n");
    }

    function downloadMarkdown() {
      if (!latestSets.length) generateSets();
      const blob = new Blob([toMarkdown()], { type: "text/markdown;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "generated_problem_sets.md";
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function setup() {
      const startWeek = document.getElementById("startWeek");
      const endWeek = document.getElementById("endWeek");
      const conceptFilter = document.getElementById("conceptFilter");
      for (const item of conceptDb) {
        startWeek.append(new Option(`${item.week}주차`, item.week));
        endWeek.append(new Option(`${item.week}주차`, item.week));
        conceptFilter.append(new Option(`${item.week}주차 - ${item.section}`, item.week));
      }
      startWeek.value = "3";
      endWeek.value = "13";
      conceptFilter.prepend(new Option("전체 보기", "all"));
      conceptFilter.value = "all";

      document.getElementById("generateBtn").addEventListener("click", generateSets);
      document.getElementById("downloadMd").addEventListener("click", downloadMarkdown);
      conceptFilter.addEventListener("change", renderConcepts);
      document.getElementById("problemSets").addEventListener("click", event => {
        const button = event.target.closest(".answer-toggle");
        if (!button) return;
        const panel = button.closest(".problem").querySelector(".answer-panel");
        const willOpen = panel.hidden;
        panel.hidden = !willOpen;
        button.setAttribute("aria-expanded", String(willOpen));
        button.textContent = willOpen ? "정답 코드 숨기기" : "정답 코드 확인";
      });
      document.querySelectorAll(".tab").forEach(tab => {
        tab.addEventListener("click", () => {
          document.querySelectorAll(".tab").forEach(item => item.classList.remove("active"));
          document.querySelectorAll(".section").forEach(item => item.classList.remove("active"));
          tab.classList.add("active");
          document.getElementById(tab.dataset.tab).classList.add("active");
        });
      });

      renderConcepts();
      generateSets();
    }

    setup();
  </script>
</body>
</html>
